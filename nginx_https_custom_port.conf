# Nginx Configuration - HTTPS dengan Custom Port 8001
# File: /etc/nginx/sites-available/zinusit

server {
    listen 8001 ssl http2;
    listen [::]:8001 ssl http2;
    
    server_name 10.62.8.101 it.zinus.co.id;
    
    root /home/admin/zinusit-dev/public;
    index index.php index.html;
    
    # SSL Certificate
    ssl_certificate /etc/ssl/certs/zinusit.crt;
    ssl_certificate_key /etc/ssl/private/zinusit.key;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Logs
    access_log /var/log/nginx/zinusit-access.log;
    error_log /var/log/nginx/zinusit-error.log;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Client max body size (untuk upload file)
    client_max_body_size 100M;
    
    # Root location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # IMPORTANT: Force HTTPS detection
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 8001;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 8001;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Optional: HTTP Redirect (port 8000 -> 8001 HTTPS)
server {
    listen 8000;
    listen [::]:8000;
    
    server_name 10.62.8.101 it.zinus.co.id;
    
    return 301 https://$host:8001$request_uri;
}
